name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: algoearning
          POSTGRES_PASSWORD: algoearning
          POSTGRES_DB: algoearning_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algoearning" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REQUIRE_DB: "1"
      TEST_DATABASE_URL: postgresql+psycopg://algoearning:algoearning@localhost:5432/algoearning_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src apps/engine/src apps/worker/src packages/py-*/src
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - name: API types are up to date with the API
        run: pnpm --filter @algoearning/api-types check
      - run: pnpm lint
      - run: pnpm format:check
      - name: Theme contrast (WCAG AA, light + dark)
        run: uv run python scripts/check-contrast.py
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/api.Dockerfile -t algoearning-api .
      - run: docker build -f infra/docker/web.Dockerfile -t algoearning-web .
      - run: docker run --rm algoearning-api python -m ae_engine --once
