<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlgoEarning</title>
    <meta name="description" content="Internal Alpha Test Environment. Closed to the public." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Theme before first paint: the visitor's choice ("dark" | "light" | "system", same key as the app's theme
      // switch), dark when there is none. data-choice picks the switch's label, data-theme the colours.
      (function () {
        var choice = "dark";
        try {
          choice = localStorage.getItem("theme") || "dark";
        } catch (e) {}
        var light =
          choice === "light" || (choice === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.choice = choice;
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="landing.css" />
  </head>
  <body>
    <button id="theme-btn" class="theme" type="button" aria-label="Dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="5" />
        <path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke-linecap="round" />
      </svg>
    </button>
    <main class="splash">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M3 17l6-6 4 4 8-8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M15 7h6v6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <h1>AlgoEarning</h1>
      <p>Internal Alpha Test Environment. Closed to the public.</p>
    </main>
    <script>
      // the theme switch cycles dark -> light -> system and remembers the choice in this browser
      (function () {
        var order = ["dark", "light", "system"];
        var names = { dark: "Dark theme", light: "Light theme", system: "System theme" };
        var root = document.documentElement;
        var btn = document.getElementById("theme-btn");
        var media = matchMedia("(prefers-color-scheme: light)");
        function apply(choice) {
          root.dataset.choice = choice;
          root.dataset.theme =
            choice === "light" || (choice === "system" && media.matches) ? "light" : "dark";
          var next = order[(order.indexOf(choice) + 1) % order.length];
          btn.setAttribute("aria-label", names[choice] + " (switch to " + names[next].toLowerCase() + ")");
        }
        apply(root.dataset.choice || "dark");
        btn.addEventListener("click", function () {
          var next = order[(order.indexOf(root.dataset.choice) + 1) % order.length];
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
          apply(next);
        });
        media.addEventListener("change", function () {
          if (root.dataset.choice === "system") apply("system");
        });
      })();
    </script>
  </body>
</html>
