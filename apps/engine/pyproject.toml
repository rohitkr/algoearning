[project]
name = "ae-engine"
version = "0.1.0"
description = "AlgoEarning trading engine: per-user broker sessions and strategy runners"
requires-python = ">=3.13"
dependencies = [
    "structlog>=26.1",
    "redis>=8.1",
    "ae-core",
    "ae-db",
    "ae-marketdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_engine"]

[tool.uv.sources]
ae-core = { workspace = true }
ae-db = { workspace = true }
ae-marketdata = { workspace = true }
