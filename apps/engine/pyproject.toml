[project]
name = "ae-engine"
version = "0.1.0"
description = "AlgoEarning trading engine: per-user broker sessions and strategy runners"
requires-python = ">=3.13"
dependencies = ["structlog>=26.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_engine"]
