[project]
name = "ae-api"
version = "0.1.0"
description = "AlgoEarning HTTP + realtime API (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "ae-db",
    "redis>=8.1",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "ae-core",
    "ae-brokers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_api"]

[tool.uv.sources]
ae-db = { workspace = true }
ae-core = { workspace = true }
ae-brokers = { workspace = true }
