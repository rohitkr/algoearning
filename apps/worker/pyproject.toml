[project]
name = "ae-worker"
version = "0.1.0"
description = "AlgoEarning background jobs (scheduled + async)"
requires-python = ">=3.13"
dependencies = ["structlog>=26.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_worker"]
