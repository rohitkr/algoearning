# Python workspace (uv). Every app/package below is its own installable project; `uv sync --all-packages`
# installs them all (editable) into one .venv for development.
[tool.uv.workspace]
members = ["apps/api", "apps/engine", "apps/worker", "apps/signals", "packages/py-core", "packages/py-brokers",
           "packages/py-marketdata", "packages/py-db", "packages/py-telegram"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "httpx2>=2.13",
    "ruff>=0.16",
    "mypy>=2.3",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "UP046", "UP047"]    # assert is fine in tests; Generic[T] kept for pydantic/SQLAlchemy compat

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201"]
"**/migrations/versions/*" = ["E501", "W291"]   # generated by Alembic
"**/tests/**" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/engine/tests", "apps/worker/tests", "apps/signals/tests", "packages/py-core/tests",
             "packages/py-brokers/tests", "packages/py-marketdata/tests", "packages/py-db/tests",
             "packages/py-telegram/tests"]
asyncio_mode = "auto"
addopts = "-q --import-mode=importlib"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
