# Full local stack: `make up`. Same images deploy anywhere (hosting is decided later).
name: algoearning
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: algoearning
      POSTGRES_PASSWORD: algoearning
      POSTGRES_DB: algoearning
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoearning"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["alembic", "-c", "packages/py-db/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://algoearning:algoearning@postgres:5432/algoearning
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    environment:
      APP_ENV: development
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://algoearning:algoearning@postgres:5432/algoearning
      REDIS_URL: redis://redis:6379/0
      DEV_AUTH: "true"
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      retries: 5
  engine:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["python", "-m", "ae_engine"]
    environment:
      DATABASE_URL: postgresql://algoearning:algoearning@postgres:5432/algoearning
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  feed:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["python", "-m", "ae_marketdata"]
    environment:
      DATABASE_URL: postgresql://algoearning:algoearning@postgres:5432/algoearning
      REDIS_URL: redis://redis:6379/0
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-simulated}
      BREEZE_API_KEY: ${BREEZE_API_KEY:-}
      BREEZE_API_SECRET: ${BREEZE_API_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["python", "-m", "ae_worker"]
    environment:
      DATABASE_URL: postgresql://algoearning:algoearning@postgres:5432/algoearning
    restart: unless-stopped
    depends_on: [api]
  web:
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  pgdata:
