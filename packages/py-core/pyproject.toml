[project]
name = "ae-core"
version = "0.1.0"
description = "Trading domain: lifecycle, risk, validation, orders, trade/strategy services"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_core"]
