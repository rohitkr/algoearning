[project]
name = "ae-telegram"
version = "0.1.0"
description = "Read-only Telegram access for signal sources (ADR 0025): login, list chats, read, listen; never send"
requires-python = ">=3.13"
dependencies = [
    "telethon>=1.40,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_telegram"]
