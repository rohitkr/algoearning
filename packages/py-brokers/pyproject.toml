[project]
name = "ae-brokers"
version = "0.1.0"
description = "Broker adapters (execution): BrokerAdapter + Zerodha first"
requires-python = ">=3.13"
dependencies = [
    "ae-core",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_brokers"]

[tool.uv.sources]
ae-core = { workspace = true }
