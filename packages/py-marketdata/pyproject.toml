[project]
name = "ae-marketdata"
version = "0.1.0"
description = "Platform market-data feed (Breeze or the platform Kite account) and tick fan-out"
requires-python = ">=3.13"
dependencies = ["ae-core", "ae-db", "ae-brokers", "httpx>=0.28", "structlog>=26.1", "redis>=8.1", "breeze-connect>=1.0.60", "websockets>=15",
    "smartmoneyconcepts>=0.0.27", "pandas>=2.2", "numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_marketdata"]

[tool.uv.sources]
ae-core = { workspace = true }
ae-db = { workspace = true }
ae-brokers = { workspace = true }
