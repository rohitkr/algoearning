[project]
name = "ae-db"
version = "0.1.0"
description = "SQLAlchemy models, Alembic migrations, user-scoped repositories"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "sqlalchemy[asyncio]>=2.1",
    "ae-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae_db"]

[tool.uv.sources]
ae-core = { workspace = true }
